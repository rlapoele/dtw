<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc"><title id="title">Focused improvement proposal: compact header feedback and inspector surface</title><desc id="desc">Two static layout studies compare preserving the 44 pixel inspector header for applied and draft previews with adding a separate 48 pixel feedback band. Both keep the selected token visible. A surface board shows white token list and inputs against the existing neutral navigation color proposed for the inspector.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1440" height="1040" rx="0" fill="#fff"/><text x="40" y="46" font-size="28" fill="#20242d" font-weight="600">Focused improvement proposal</text><text x="40" y="76" font-size="15" fill="#5c6675" font-weight="400">Static design study · V5.2.4 review baseline · Not implemented</text><text x="40" y="126" font-size="20" fill="#20242d" font-weight="600">A · Header feedback</text><text x="40" y="151" font-size="13" fill="#5c6675" font-weight="400">Recommended · preserve 44px footprint</text><text x="420" y="126" font-size="20" fill="#20242d" font-weight="600">B · Extra feedback band</text><text x="420" y="151" font-size="13" fill="#5c6675" font-weight="400">Alternative · adds a separate 48px band</text><rect x="40" y="178" width="320" height="568" rx="8" fill="#fff" stroke="#bac1cd"/><text x="56" y="208" font-size="14" fill="#20242d" font-weight="600">Token Workbench</text><text x="264" y="208" font-size="10" fill="#5c6675" font-weight="400">Session only</text><line x1="40" y1="230" x2="360" y2="230" stroke="#e3e6ec" stroke-width="1"/><rect x="41" y="231" width="318" height="69" rx="0" fill="#f0f2f5"/><text x="56" y="253" font-size="10" fill="#5c6675" font-weight="400">Prototype review toolbar</text><rect x="56" y="264" width="216" height="28" rx="4" fill="#fff" stroke="#e3e6ec"/><text x="66" y="282" font-size="11" fill="#20242d" font-weight="400">Standard editing</text><rect x="41" y="301" width="318" height="41" rx="0" fill="#f7f8fa"/><text x="56" y="317" font-size="10" fill="#5c6675" font-weight="400">Work exists only in this page.</text><text x="56" y="331" font-size="10" fill="#5c6675" font-weight="400">Leaving discards all session work.</text><text x="56" y="366" font-size="11" fill="#5c6675" font-weight="400">Token list · independently scrollable</text><rect x="56" y="415" width="288" height="68" rx="0" fill="#f0f2f5"/><rect x="56" y="415" width="4" height="68" rx="0" fill="#20242d"/><rect x="70" y="436" width="38" height="16" rx="3" fill="#3b82f6" stroke="#d5dae3"/><text x="118" y="440" font-size="12" fill="#20242d" font-weight="600">color / blue / 500</text><text x="118" y="459" font-size="10" fill="#5c6675" font-weight="400">Selected token remains visible</text><line x1="40" y1="493" x2="360" y2="493" stroke="#d4d8e0" stroke-width="1"/><rect x="41" y="494" width="318" height="225" rx="0" fill="#fafbfc"/><text x="52" y="519" font-size="11" fill="#20242d" font-weight="600">Token inspector</text><text x="154" y="507" font-size="11" fill="#5c6675" font-weight="400">Applied</text><rect x="154" y="513" width="38" height="16" rx="3" fill="#3b82f6" stroke="#d5dae3"/><text x="220" y="507" font-size="11" fill="#5c6675" font-weight="400">Draft</text><rect x="220" y="513" width="38" height="16" rx="3" fill="#fa6b70" stroke="#d5dae3"/><rect x="316" y="494" width="43" height="43" rx="0" fill="#fafbfc"/><text x="331" y="520" font-size="18" fill="#20242d" font-weight="400">⌄</text><line x1="40" y1="537" x2="360" y2="537" stroke="#e3e6ec" stroke-width="1"/><text x="56" y="548" font-size="10" fill="#5c6675" font-weight="400">Component controls scroll here</text><text x="228" y="570" font-size="10" fill="#20242d" font-weight="400">Hue (°)</text><rect x="60" y="580" width="156" height="10" rx="5" fill="#d6dbe3"/><rect x="130" y="572" width="10" height="26" rx="2" fill="#fff" stroke="#20242d"/><rect x="228" y="575" width="112" height="40" rx="5" fill="#fff" stroke="#d5dae3"/><text x="238" y="600" font-size="12" fill="#20242d" font-weight="400">0</text><rect x="41" y="663" width="318" height="56" rx="0" fill="#fafbfc"/><line x1="40" y1="663" x2="360" y2="663" stroke="#e3e6ec" stroke-width="1"/><rect x="160" y="675" width="65" height="32" rx="5" fill="#fff" stroke="#d5dae3"/><text x="171" y="696" font-size="11" fill="#20242d" font-weight="400">Cancel</text><rect x="234" y="675" width="110" height="32" rx="5" fill="#252a33"/><text x="247" y="696" font-size="11" fill="#fff" font-weight="400">Apply changes</text><rect x="41" y="720" width="318" height="25" rx="0" fill="#fafbfc"/><text x="56" y="736" font-size="9" fill="#5c6675" font-weight="400">Memory only · No recovery after reload</text><rect x="420" y="178" width="320" height="568" rx="8" fill="#fff" stroke="#bac1cd"/><text x="436" y="208" font-size="14" fill="#20242d" font-weight="600">Token Workbench</text><text x="644" y="208" font-size="10" fill="#5c6675" font-weight="400">Session only</text><line x1="420" y1="230" x2="740" y2="230" stroke="#e3e6ec" stroke-width="1"/><rect x="421" y="231" width="318" height="69" rx="0" fill="#f0f2f5"/><text x="436" y="253" font-size="10" fill="#5c6675" font-weight="400">Prototype review toolbar</text><rect x="436" y="264" width="216" height="28" rx="4" fill="#fff" stroke="#e3e6ec"/><text x="446" y="282" font-size="11" fill="#20242d" font-weight="400">Standard editing</text><rect x="421" y="301" width="318" height="41" rx="0" fill="#f7f8fa"/><text x="436" y="317" font-size="10" fill="#5c6675" font-weight="400">Work exists only in this page.</text><text x="436" y="331" font-size="10" fill="#5c6675" font-weight="400">Leaving discards all session work.</text><text x="436" y="366" font-size="11" fill="#5c6675" font-weight="400">Token list · independently scrollable</text><rect x="436" y="415" width="288" height="68" rx="0" fill="#f0f2f5"/><rect x="436" y="415" width="4" height="68" rx="0" fill="#20242d"/><rect x="450" y="436" width="38" height="16" rx="3" fill="#3b82f6" stroke="#d5dae3"/><text x="498" y="440" font-size="12" fill="#20242d" font-weight="600">color / blue / 500</text><text x="498" y="459" font-size="10" fill="#5c6675" font-weight="400">Selected token remains visible</text><line x1="420" y1="493" x2="740" y2="493" stroke="#d4d8e0" stroke-width="1"/><rect x="421" y="494" width="318" height="225" rx="0" fill="#fafbfc"/><text x="436" y="519" font-size="11" fill="#20242d" font-weight="400">Token inspector</text><text x="710" y="519" font-size="18" fill="#20242d" font-weight="400">⌄</text><line x1="420" y1="537" x2="740" y2="537" stroke="#e3e6ec" stroke-width="1"/><text x="436" y="555" font-size="10" fill="#5c6675" font-weight="400">Applied</text><rect x="486" y="543" width="38" height="16" rx="3" fill="#3b82f6" stroke="#d5dae3"/><text x="584" y="555" font-size="10" fill="#5c6675" font-weight="400">Draft</text><rect x="624" y="543" width="38" height="16" rx="3" fill="#fa6b70" stroke="#d5dae3"/><line x1="420" y1="585" x2="740" y2="585" stroke="#e3e6ec" stroke-width="1"/><text x="436" y="596" font-size="10" fill="#5c6675" font-weight="400">Component controls scroll here</text><text x="608" y="618" font-size="10" fill="#20242d" font-weight="400">Hue (°)</text><rect x="440" y="628" width="156" height="10" rx="5" fill="#d6dbe3"/><rect x="510" y="620" width="10" height="26" rx="2" fill="#fff" stroke="#20242d"/><rect x="608" y="623" width="112" height="40" rx="5" fill="#fff" stroke="#d5dae3"/><text x="618" y="648" font-size="12" fill="#20242d" font-weight="400">0</text><rect x="421" y="663" width="318" height="56" rx="0" fill="#fafbfc"/><line x1="420" y1="663" x2="740" y2="663" stroke="#e3e6ec" stroke-width="1"/><rect x="540" y="675" width="65" height="32" rx="5" fill="#fff" stroke="#d5dae3"/><text x="551" y="696" font-size="11" fill="#20242d" font-weight="400">Cancel</text><rect x="614" y="675" width="110" height="32" rx="5" fill="#252a33"/><text x="627" y="696" font-size="11" fill="#fff" font-weight="400">Apply changes</text><rect x="421" y="720" width="318" height="25" rx="0" fill="#fafbfc"/><text x="436" y="736" font-size="9" fill="#5c6675" font-weight="400">Memory only · No recovery after reload</text><text x="800" y="126" font-size="20" fill="#20242d" font-weight="600">Why A</text><text x="800" y="162" font-size="15" fill="#5c6675" font-weight="400">Move the labeled specimen pair into the inspector header.</text><text x="800" y="187" font-size="15" fill="#5c6675" font-weight="400">Preview context is noninteractive; collapse is its own button.</text><text x="800" y="212" font-size="15" fill="#5c6675" font-weight="400">Remove the large duplicate comparison card from the form.</text><text x="800" y="237" font-size="15" fill="#5c6675" font-weight="400">Keep detailed unavailable reasons beside the affected fields.</text><text x="800" y="292" font-size="18" fill="#20242d" font-weight="600">Editing-space tradeoff at 320 × 568</text><text x="800" y="327" font-size="15" fill="#5c6675" font-weight="400">A reuses existing header space; no additional pinned band.</text><text x="800" y="352" font-size="15" fill="#5c6675" font-weight="400">B keeps the existing header and adds 48px below it.</text><text x="800" y="377" font-size="15" fill="#5c6675" font-weight="400">Both retain the selected list row and the action footer.</text><text x="800" y="402" font-size="15" fill="#5c6675" font-weight="400">The extra band leaves much less room for a complete row.</text><text x="800" y="457" font-size="18" fill="#20242d" font-weight="600">Behavior stays explicit</text><text x="800" y="492" font-size="15" fill="#5c6675" font-weight="400">Applied = latest successful commit; Draft = active form.</text><text x="800" y="517" font-size="15" fill="#5c6675" font-weight="400">Invalid or unresolved preview shows “Unavailable”.</text><text x="800" y="542" font-size="15" fill="#5c6675" font-weight="400">No stale swatch or fallback color is substituted.</text><text x="800" y="567" font-size="15" fill="#5c6675" font-weight="400">Resolved &amp; trace remains applied-only.</text><text x="800" y="592" font-size="15" fill="#5c6675" font-weight="400">No new numeric, gamut, storage or picker policy.</text><text x="800" y="652" font-size="14" fill="#20242d" font-weight="600">This board is an annotated layout study.</text><text x="800" y="677" font-size="13" fill="#5c6675" font-weight="400">Current short-phone chrome is retained for a fair comparison.</text><text x="800" y="698" font-size="13" fill="#5c6675" font-weight="400">Geometry and illustrative swatches are proposed, not measured</text><text x="800" y="719" font-size="13" fill="#5c6675" font-weight="400">behavior or color-conversion evidence. Verify the approved</text><text x="800" y="740" font-size="13" fill="#5c6675" font-weight="400">revision with keyboard, focus, short viewports and zoom.</text><text x="40" y="798" font-size="20" fill="#20242d" font-weight="600">Supporting surface and meaningful-value contrast</text><rect x="40" y="822" width="700" height="170" rx="5" fill="#fff" stroke="#e3e6ec"/><rect x="41" y="823" width="170" height="168" rx="0" fill="#fafbfc"/><text x="57" y="850" font-size="13" fill="#20242d" font-weight="600">Navigation</text><text x="57" y="873" font-size="12" fill="#5c6675" font-weight="400">#fafbfc</text><rect x="212" y="823" width="260" height="168" rx="0" fill="#fff"/><text x="228" y="850" font-size="13" fill="#20242d" font-weight="600">Token list</text><text x="228" y="873" font-size="12" fill="#5c6675" font-weight="400">#ffffff</text><rect x="228" y="890" width="226" height="46" rx="3" fill="#f0f2f5"/><text x="242" y="918" font-size="12" fill="#5c6675" font-weight="400">0.2314 · 0.5098 · 0.9647</text><rect x="473" y="823" width="266" height="168" rx="0" fill="#fafbfc"/><text x="489" y="850" font-size="13" fill="#20242d" font-weight="600">Inspector</text><text x="489" y="873" font-size="12" fill="#5c6675" font-weight="400">#fafbfc · matches navigation</text><rect x="489" y="890" width="234" height="40" rx="4" fill="#fff" stroke="#e3e6ec"/><text x="501" y="915" font-size="12" fill="#20242d" font-weight="400">Exact input remains white</text><text x="489" y="959" font-size="11" fill="#5c6675" font-weight="400">Sticky actions use inspector surface</text><text x="800" y="838" font-size="14" fill="#5c6675" font-weight="400">Propose #5c6675 for meaningful secondary values.</text><text x="800" y="861" font-size="14" fill="#5c6675" font-weight="400">Calculated contrast: white 5.81:1; selected row 5.18:1;</text><text x="800" y="884" font-size="14" fill="#5c6675" font-weight="400">inspector 5.61:1. This reuses an existing neutral.</text><text x="800" y="907" font-size="14" fill="#5c6675" font-weight="400"></text><text x="800" y="930" font-size="14" fill="#5c6675" font-weight="400">Surface tint is deliberately subtle. Preserve the existing</text><text x="800" y="953" font-size="14" fill="#5c6675" font-weight="400">boundary, headings and restrained mobile shadow; do not</text><text x="800" y="976" font-size="14" fill="#5c6675" font-weight="400">depend on the tint alone to communicate pane meaning.</text></g></svg>