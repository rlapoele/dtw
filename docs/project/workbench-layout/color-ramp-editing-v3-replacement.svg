<text x="884" y="503" font-size="13" font-weight="600" fill="#262626">950</text>
<svg x="1001" y="483" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#404040" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V6.75a4.5 4.5 0 1 1 9 0v3.75M3.75 21.75h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H3.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
<text x="849" y="779" font-size="13" font-weight="600" fill="#262626">Shared ramp draft</text>
<text x="849" y="803" font-size="12" font-weight="400" fill="#666">No changes saved yet</text>
<line x1="1064" y1="175" x2="1064" y2="825" stroke="#e5e5e5" stroke-width="1"/>
<text x="1084" y="204" font-size="22" font-weight="600" fill="#262626">Ramp settings</text>
<text x="1084" y="248" font-size="14" font-weight="600" fill="#262626">Step count</text>
<rect x="1084" y="258" width="468" height="35" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="1096" y="281" font-size="15" font-weight="400" fill="#262626">6</text>
<text x="1084" y="330" font-size="14" font-weight="600" fill="#262626">Recipe seed</text>
<rect x="1084" y="340" width="468" height="35" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="1096" y="363" font-size="15" font-weight="400" fill="#262626">#3B82F6 · unchanged</text>
<text x="1084" y="412" font-size="14" font-weight="600" fill="#262626">Seed position</text>
<rect x="1084" y="422" width="468" height="35" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="1096" y="445" font-size="15" font-weight="400" fill="#262626">400  ▾</text>
<text x="1084" y="476" font-size="13" font-weight="400" fill="#666">500 disappeared → Auto placed the seed at 400.</text>
<text x="1084" y="502" font-size="13" font-weight="400" fill="#666">A surviving valid position would stay unchanged.</text>
<rect x="1084" y="525" width="468" height="34" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="1318.0" y="547" font-size="14" font-weight="600" fill="#262626" text-anchor="middle">Recalculate Auto placement</text>
<text x="1084" y="602" font-size="14" font-weight="600" fill="#262626">Color intensity</text>
<rect x="1084" y="612" width="468" height="35" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="1096" y="635" font-size="15" font-weight="400" fill="#262626">Retained  ▾</text>
<text x="1084" y="677" font-size="14" font-weight="400" fill="#262626">Target gamut: sRGB</text>
<rect x="1084" y="703" width="468" height="34" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="1318.0" y="725" font-size="14" font-weight="600" fill="#262626" text-anchor="middle">Review reference impacts · 1 choice needed</text>
<text x="1084" y="767" font-size="13" font-weight="600" fill="#262626">1 replacement · 1 unresolved reference choice</text>
<rect x="1084" y="786" width="468" height="34" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="1318.0" y="808" font-size="14" font-weight="600" fill="#262626" text-anchor="middle">Apply ramp changes · unavailable</text>
<rect x="24" y="899" width="762" height="365" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="48" y="933" font-size="20" font-weight="600" fill="#262626">Alternative: required name is occupied</text>
<line x1="24" y1="952" x2="786" y2="952" stroke="#e5e5e5" stroke-width="1"/>
<text x="48" y="989" font-size="20" font-weight="600" fill="#262626">Cannot replace the ramp with 11 steps</text>
<text x="48" y="1025" font-size="16" font-weight="600" fill="#262626">color.brand.300 exists outside this ramp.</text>
<text x="48" y="1060" font-size="14" font-weight="400" fill="#262626">Choose another count, or resolve its name through ordinary editing.</text>
<text x="48" y="1091" font-size="14" font-weight="400" fill="#262626">The current draft and the existing token are unchanged.</text>
<rect x="48" y="1131" width="714" height="34" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="405.0" y="1153" font-size="14" font-weight="600" fill="#262626" text-anchor="middle">Back to ramp settings</text>
<text x="48" y="1205" font-size="13" font-weight="400" fill="#666">No adoption, overwrite or second independently saving editor.</text>
<rect x="814" y="899" width="762" height="365" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="838" y="933" font-size="20" font-weight="600" fill="#262626">Navigate away while changes are pending</text>
<line x1="814" y1="952" x2="1576" y2="952" stroke="#e5e5e5" stroke-width="1"/>
<text x="838" y="989" font-size="20" font-weight="600" fill="#262626">Apply ramp changes before leaving?</text>
<text x="838" y="1025" font-size="14" font-weight="400" fill="#262626">The saved ramp is still available by discarding this draft.</text>
<rect x="838" y="1062" width="228" height="34" rx="7" fill="#262626" stroke="#d4d4d4"/>
<text x="952.0" y="1084" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Apply and leave</text>
<rect x="1078" y="1062" width="228" height="34" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="1192.0" y="1084" font-size="14" font-weight="600" fill="#262626" text-anchor="middle">Discard and leave</text>
<rect x="1318" y="1062" width="234" height="34" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="1435.0" y="1084" font-size="14" font-weight="600" fill="#262626" text-anchor="middle">Keep editing</text>
<text x="838" y="1135" font-size="14" font-weight="400" fill="#262626">Unanswered required choices disable Apply and leave.</text>
<text x="838" y="1170" font-size="14" font-weight="400" fill="#262626">An explicitly accepted Unspecified choice is a resolved decision.</text>
<text x="838" y="1205" font-size="14" font-weight="400" fill="#262626">If saving fails, stay here with the draft intact.</text>
<text x="32" y="1321" font-size="14" font-weight="400" fill="#666">Ordinary seed/settings changes preserve protected colors without prompts. Only confirmed count replacement overrides that protection.</text>
</svg>