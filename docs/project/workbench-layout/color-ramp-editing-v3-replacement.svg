<svg x="1001" y="409" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#404040" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V6.75a4.5 4.5 0 1 1 9 0v3.75M3.75 21.75h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H3.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
<rect x="849" y="448" width="25" height="25" rx="7" fill="#0d3473" stroke="#d4d4d4"/>
<text x="884" y="466" font-size="13" font-weight="600" fill="#262626">800</text>
<svg x="1001" y="446" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#404040" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
