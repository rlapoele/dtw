<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1370" viewBox="0 0 1600 1370">
<rect width="100%" height="100%" fill="#f5f5f5"/>
<style>text{font-family:Arial,sans-serif} .mono{font-family:Menlo,monospace}</style>
<text x="32" y="40" font-size="24" font-weight="600" fill="#262626">Count replacement · confirmation changes the draft, Apply saves it</text>
<text x="32" y="67" font-size="15" font-weight="400" fill="#666">Ramp settings → change Step count. Cancel preserves your current draft. No list of departing steps.</text>
<rect x="24" y="99" width="762" height="770" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="48" y="133" font-size="20" font-weight="600" fill="#262626">1 · Confirm replacement</text>
<line x1="24" y1="152" x2="786" y2="152" stroke="#e5e5e5" stroke-width="1"/>
<text x="48" y="183" font-size="24" font-weight="600" fill="#262626">Replace this ramp with 6 steps?</text>
<text x="48" y="224" font-size="17" font-weight="600" fill="#262626">Your individual color adjustments will be replaced.</text>
<text x="48" y="266" font-size="15" font-weight="400" fill="#262626">Saved and pending manual colors are regenerated.</text>
<text x="48" y="304" font-size="15" font-weight="400" fill="#262626">Protected colors can change; steps absent from the new ramp</text>
<text x="48" y="329" font-size="15" font-weight="400" fill="#262626">are removed even when protected.</text>
<text x="48" y="367" font-size="15" font-weight="400" fill="#262626">Referencing tokens may change color or need a new target.</text>
<text x="48" y="405" font-size="15" font-weight="400" fill="#262626">Surviving steps keep their identity, descriptions and lock choices.</text>
<text x="48" y="443" font-size="15" font-weight="400" fill="#262626">New steps start Generated and unprotected.</text>
<text x="48" y="481" font-size="15" font-weight="400" fill="#262626">Returning to the old count will not restore earlier edits</text>
<text x="48" y="506" font-size="15" font-weight="400" fill="#262626">or remapping choices.</text>
<rect x="48" y="546" width="714" height="95" rx="7" fill="#f5f5f5" stroke="#d4d4d4"/>
<text x="65" y="576" font-size="17" font-weight="600" fill="#262626">Your saved ramp stays unchanged until Apply.</text>
<text x="65" y="608" font-size="15" font-weight="400" fill="#262626">Discarding the whole draft restores that saved ramp.</text>
<rect x="48" y="677" width="215" height="34" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="155.5" y="699" font-size="14" font-weight="600" fill="#262626" text-anchor="middle">Cancel</text>
<rect x="278" y="677" width="484" height="34" rx="7" fill="#262626" stroke="#d4d4d4"/>
<text x="520.0" y="699" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Replace in draft</text>
<text x="48" y="755" font-size="15" font-weight="600" fill="#262626">Confirmation is not a save.</text>
<text x="48" y="785" font-size="14" font-weight="400" fill="#666">Any required reference choices follow inside the inspector.</text>
<text x="48" y="815" font-size="14" font-weight="400" fill="#666">An occupied non-member name blocks replacement first.</text>
<rect x="814" y="99" width="762" height="770" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="838" y="133" font-size="20" font-weight="600" fill="#262626">2 · Review the replacement in Ramp settings</text>
<line x1="814" y1="152" x2="1576" y2="152" stroke="#e5e5e5" stroke-width="1"/>
<rect x="834" y="175" width="210" height="650" rx="7" fill="#fafafa" stroke="#d4d4d4"/>
<text x="849" y="203" font-size="17" font-weight="600" fill="#262626">color.brand</text>
<rect x="849" y="217" width="180" height="34" rx="7" fill="#fff" stroke="#d4d4d4"/>
<text x="939.0" y="239" font-size="14" font-weight="600" fill="#262626" text-anchor="middle">Ramp settings</text>
<text x="849" y="279" font-size="12" font-weight="400" fill="#737373">OKLCH · sRGB preview</text>
<rect x="849" y="300" width="25" height="25" rx="7" fill="#f1f5fc" stroke="#d4d4d4"/>
<text x="884" y="318" font-size="13" font-weight="600" fill="#262626">50</text>
