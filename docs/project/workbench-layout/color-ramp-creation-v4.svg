<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1040" viewBox="0 0 1320 1040"><title>Proposed two-stage color ramp creation</title><desc>Configure group, seed, scale and placement in one form, then review and create atomically. Static schematic.</desc><style>text{font-family:Arial,sans-serif;fill:#171717;font-size:14px}.muted{fill:#737373;font-size:12px}.label{font-size:12px;font-weight:600}.title{font-size:22px;font-weight:600}.section{font-size:15px;font-weight:600}.mono{font-family:monospace;font-size:12px}.button{font-size:13px;font-weight:600}.white{fill:white}.step{font-size:12px;font-weight:600;fill:#525252}</style><rect width="1320" height="1040" fill="#f5f5f5"/><text x="36" y="34" class="title">Color ramp creation · V4 proposal</text><text x="36" y="58" class="muted">One form, then review. Existing color rules and the atomic Create action remain unchanged.</text><rect x="36" y="84" width="606" height="898" rx="6" fill="#fff" stroke="#d4d4d4"/><text x="60" y="114" class="step">CONFIGURE  /  REVIEW</text><rect x="678" y="84" width="606" height="898" rx="6" fill="#fff" stroke="#d4d4d4"/><text x="702" y="114" class="step">CONFIGURE  /  REVIEW</text><text x="60" y="152" class="title">Create a group</text><text x="60" y="177" class="muted">1 of 2 · Configure</text><rect x="60" y="196" width="16" height="16" rx="3" fill="#171717" stroke="#171717"/><text x="84" y="209" class="">Generate a color ramp</text><text x="60" y="243" class="label">Name</text><rect x="60" y="253" width="263" height="36" rx="6" fill="#fff" stroke="#d4d4d4"/><text x="72" y="276" class="">blue</text><text x="339" y="243" class="label">Parent group</text><rect x="339" y="253" width="279" height="36" rx="6" fill="#fff" stroke="#d4d4d4"/><text x="351" y="276" class="">colors</text><text x="60" y="312" class="mono">Path: colors / blue</text><text x="60" y="353" class="section">Seed</text><text x="60" y="381" class="label">Seed HEX</text><rect x="60" y="391" width="200" height="36" rx="6" fill="#fff" stroke="#d4d4d4"/><text x="72" y="414" class="">#3366CC</text><rect x="276" y="391" width="52" height="36" rx="6" fill="#3366cc" stroke="#d4d4d4"/><text x="350" y="414" class="button">Advanced</text><text x="60" y="450" class="muted">Will be authored in OKLCH · Project default</text><text x="60" y="473" class="mono">Authored coordinates and alpha shown here</text><text x="60" y="507" class="label">Seed description (optional)</text><rect x="60" y="517" width="558" height="36" rx="6" fill="#fff" stroke="#d4d4d4"/><text x="72" y="540" class="">Brand blue</text><text x="60" y="572" class="muted">Saved only on the final seed-position token.</text><text x="60" y="612" class="section">Scale and placement</text><text x="60" y="641" class="label">Step count</text><rect x="60" y="651" width="263" height="36" rx="6" fill="#fff" stroke="#d4d4d4"/><text x="72" y="674" class="">11</text><text x="339" y="641" class="label">Color intensity</text><rect x="339" y="651" width="279" height="36" rx="6" fill="#fff" stroke="#d4d4d4"/><text x="351" y="674" class="">Retained</text><text x="60" y="714" class="label">Seed position</text><rect x="60" y="724" width="263" height="36" rx="6" fill="#fff" stroke="#d4d4d4"/><text x="72" y="747" class="">500 · Auto</text><text x="347" y="748" class="button">Use Auto position</text><text x="60" y="790" class="muted">sRGB target · Generated OKLCH · Primitive</text><rect x="60" y="810" width="46" height="30" rx="4" fill="#eff6ff" stroke="#eff6ff"/><rect x="110" y="810" width="46" height="30" rx="4" fill="#dbeafe" stroke="#dbeafe"/><rect x="160" y="810" width="46" height="30" rx="4" fill="#bfdbfe" stroke="#bfdbfe"/><rect x="210" y="810" width="46" height="30" rx="4" fill="#93c5fd" stroke="#93c5fd"/><rect x="260" y="810" width="46" height="30" rx="4" fill="#60a5fa" stroke="#60a5fa"/><rect x="310" y="810" width="46" height="30" rx="4" fill="#3366cc" stroke="#3366cc"/><rect x="360" y="810" width="46" height="30" rx="4" fill="#2563eb" stroke=