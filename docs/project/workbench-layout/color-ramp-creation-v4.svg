l="#fff" stroke="#d4d4d4"/><text x="804" y="944" class="button">Cancel</text><rect x="1080" y="921" width="180" height="36" rx="6" fill="#171717" stroke="#171717"/><text x="1094" y="944" class="button white">Create color ramp</text><text x="36" y="1012" class="muted">Static proposal: conditional errors and gamut choices appear beside their inputs; details are in the accompanying design note.</text></svg>