<text x="966" y="444" font-family="Arial, sans-serif" font-size="12" fill="#171717" font-weight="600">500 · Manual · Seed position</text>
<text x="966" y="469" font-family="Arial, sans-serif" font-size="12" fill="#686868" font-weight="400">Step editor or stacked review cards</text>
<rect x="966" y="508" width="84" height="32" rx="6" fill="white" stroke="#d4d4d4"/>
<text x="978" y="529" font-family="Arial, sans-serif" font-size="13" fill="#171717" font-weight="600">Cancel</text>
<rect x="1062" y="508" width="140" height="32" rx="6" fill="#171717" stroke="#171717"/>
<text x="1074" y="529" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="600">Review</text>
<text x="640" y="595" font-family="Arial, sans-serif" font-size="14" fill="#171717" font-weight="600">No three-column layout squeezed onto a phone.</text>
<text x="40" y="666" font-family="Arial, sans-serif" font-size="18" fill="#171717" font-weight="600">Shared behavior</text>
<text x="40" y="700" font-family="Arial, sans-serif" font-size="14" fill="#686868" font-weight="400">Continue begins one provisional ramp draft; final confirmation saves group, tokens and settings together.</text>
<text x="40" y="729" font-family="Arial, sans-serif" font-size="14" fill="#686868" font-weight="400">Back preserves the draft. Cancel/discard leaves no empty group. Reopening starts from applied values.</text>
<text x="40" y="758" font-family="Arial, sans-serif" font-size="14" fill="#686868" font-weight="400">Manual step edits stay local. Editing the seed-position token does not change the saved recipe seed.</text>
<text x="40" y="787" font-family="Arial, sans-serif" font-size="14" fill="#686868" font-weight="400">On narrow screens swatches wrap in order; review rows stack as labeled cards; actions remain reachable.</text>
</svg>
