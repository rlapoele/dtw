<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>Color ramp authoring wireframe comparison</title><rect width="1280" height="850" fill="#f5f5f5"/>
<text x="40" y="42" font-family="Arial, sans-serif" font-size="25" fill="#171717" font-weight="700">Color ramps V2 · Shared entry and narrow layouts</text>
<text x="40" y="70" font-family="Arial, sans-serif" font-size="14" fill="#686868" font-weight="400">Static wireframes · agreed entry, proposed surfaces · no palette algorithm represented</text>
<rect x="40" y="105" width="560" height="510" rx="6" fill="white" stroke="#d4d4d4"/>
<text x="65" y="141" font-family="Arial, sans-serif" font-size="19" fill="#171717" font-weight="600">Shared entry: New group</text>
<text x="70" y="183" font-family="Arial, sans-serif" font-size="13" fill="#686868" font-weight="400">Name</text>
<rect x="70" y="193" width="490" height="32" rx="6" fill="white" stroke="#d4d4d4"/>
<text x="80" y="214" font-family="Arial, sans-serif" font-size="14" fill="#171717" font-weight="400">blue</text>
<text x="70" y="252" font-family="Arial, sans-serif" font-size="13" fill="#686868" font-weight="400">Parent group</text>
<rect x="70" y="262" width="490" height="32" rx="6" fill="white" stroke="#d4d4d4"/>
<text x="80" y="283" font-family="Arial, sans-serif" font-size="14" fill="#171717" font-weight="400">color                                     ▾</text>
<rect x="70" y="322" width="20" height="20" rx="3" fill="#171717" stroke="#171717"/>
<text x="74" y="337" font-family="Arial, sans-serif" font-size="15" fill="white" font-weight="600">✓</text>
<text x="102" y="338" font-family="Arial, sans-serif" font-size="16" fill="#171717" font-weight="600">Generate a color ramp</text>
<text x="102" y="364" font-family="Arial, sans-serif" font-size="13" fill="#686868" font-weight="400">Create 11 color tokens and remember their settings.</text>
<rect x="70" y="394" width="490" height="84" rx="6" fill="#fafafa" stroke="#d4d4d4"/>
<text x="87" y="419" font-family="Arial, sans-serif" font-size="14" fill="#171717" font-weight="600">Path: color.blue</text>
<text x="87" y="444" font-family="Arial, sans-serif" font-size="13" fill="#686868" font-weight="400">The group and tokens are saved only after review.</text>
<rect x="324" y="527" width="90" height="32" rx="6" fill="white" stroke="#d4d4d4"/>
<text x="336" y="548" font-family="Arial, sans-serif" font-size="13" fill="#171717" font-weight="600">Cancel</text>
<rect x="426" y="527" width="134" height="32" rx="6" fill="#171717" stroke="#171717"/>
<text x="438" y="548" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="600">Continue</text>
<text x="65" y="592" font-family="Arial, sans-serif" font-size="13" fill="#686868" font-weight="400">Unchecked: ordinary group creation stays unchanged.</text>
<text x="640" y="142" font-family="Arial, sans-serif" font-size="19" fill="#171717" font-weight="600">Same editor responsibilities at narrow widths</text>
<rect x="640" y="170" width="270" height="395" rx="12" fill="white" stroke="#d4d4d4"/>
<text x="656" y="200" font-family="Arial, sans-serif" font-size="16" fill="#171717" font-weight="600">A · Full-window dialog</text>
<text x="656" y="225" font-family="Arial, sans-serif" font-size="12" fill="#686868" font-weight="400">blue · Draft, not saved</text>
<path d="M640 240h270" stroke="#d4d4d4"/>
<text x="656" y="266" font-family="Arial, sans-serif" font-size="12" fill="#686868" font-weight="400">Single vertical editing session</text>
<text x="656" y="286" font-family="Arial, sans-serif" font-size="13" fill="#686868" font-weight="400">Recipe seed</text>
<rect x="656" y="296" width="236" height="32" rx="6" fill="white" stroke="#d4d4d4"/>
<text x="666" y="317" font-family="Arial, sans-serif" font-size="14" fill="#171717" font-weight="400">#3b82f6</text>
