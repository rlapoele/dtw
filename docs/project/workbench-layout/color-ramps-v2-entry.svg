<text x="1098" y="304" font-family="Arial, sans-serif" font-size="13" fill="#171717" font-weight="600">Edit step</text>
<rect x="966" y="345" width="33" height="35" rx="3" fill="#eff6ff" stroke="#eff6ff"/>
<rect x="1005" y="345" width="33" height="35" rx="3" fill="#dbeafe" stroke="#dbeafe"/>
