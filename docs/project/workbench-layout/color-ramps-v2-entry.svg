<rect x="1005" y="385" width="33" height="35" rx="3" fill="#1d4ed8" stroke="#1d4ed8"/>
<rect x="1044" y="385" width="33" height="35" rx="3" fill="#1e40af" stroke="#1e40af"/>
<rect x="1083" y="385" width="33" height="35" rx="3" fill="#1e3a8a" stroke="#1e3a8a"/>
