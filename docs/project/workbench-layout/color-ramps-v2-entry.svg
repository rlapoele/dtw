<rect x="812" y="385" width="33" height="35" rx="3" fill="#172554" stroke="#172554"/>
<text x="656" y="444" font-family="Arial, sans-serif" font-size="12" fill="#171717" font-weight="600">500 · Manual · Seed position</text>
<text x="656" y="469" font-family="Arial, sans-serif" font-size="12" fill="#686868" font-weight="400">Step editor or stacked review cards</text>
<rect x="656" y="508" width="84" height="32" rx="6" fill="white" stroke="#d4d4d4"/>
<text x="668" y="529" font-family="Arial, sans-serif" font-size="13" fill="#171717" font-weight="600">Cancel</text>
<rect x="752" y="508" width="140" height="32" rx="6" fill="#171717" stroke="#171717"/>
<text x="764" y="529" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="600">Review</text>
<rect x="950" y="170" width="270" height="395" rx="12" fill="white" stroke="#d4d4d4"/>
<text x="966" y="200" font-family="Arial, sans-serif" font-size="16" fill="#171717" font-weight="600">B · Workbench surfaces</text>
<text x="966" y="225" font-family="Arial, sans-serif" font-size="12" fill="#686868" font-weight="400">blue · Draft, not saved</text>
<path d="M950 240h270" stroke="#d4d4d4"/>
<text x="966" y="266" font-family="Arial, sans-serif" font-size="12" fill="#686868" font-weight="400">Preview and Edit step switch views</text>
<rect x="966" y="283" width="110" height="32" rx="6" fill="#171717" stroke="#171717"/>
<text x="978" y="304" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="600">Preview</text>
