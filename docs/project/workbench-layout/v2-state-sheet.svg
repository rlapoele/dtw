<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1900" viewBox="0 0 1900 1900"><style>text{font-family:Inter,Arial,sans-serif;fill:#25282d;font-size:14px}.muted{fill:#68707d}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:650}.bold{font-weight:650}.small{font-size:12px}.mono{font-family:monospace;font-size:12px}.error{fill:#a42d27}</style><rect x="0" y="0" width="1900" height="1900" rx="0" fill="#eceef1" stroke="#d7dbe0"/><text x="24" y="42" class="title">Existing states · V2</text><text x="24" y="70" class="muted">Representative actual content patterns · complements both primary sheets · no new workflow semantics</text><rect x="24" y="110" width="430" height="300" rx="6" fill="#fff" stroke="#d7dbe0"/><text x="44" y="144" class="h">Projects unavailable</text><text x="44" y="177" class="muted">Projects unavailable. Existing browser</text><text x="44" y="198" class="muted">data is unchanged.</text><rect x="44" y="235" width="218" height="36" rx="5" fill="#fff" stroke="#d7dbe0"/><text x="56" y="258" style="fill:#25282d;font-size:13px">Retry reading projects</text><text x="44" y="305" class="muted small">Loading projects… replaces the list.</text><text x="44" y="326" class="muted small">Empty: No projects retained in this browser.</text><text x="44" y="347" class="muted small">Create / Restore only when catalogue is ready.</text><rect x="480" y="110" width="430" height="300" rx="6" fill="#fff" stroke="#d7dbe0"/><text x="500" y="144" class="h">Project unavailable</text><text x="500" y="177" class="muted">Unsupported retained project version.</text><text x="500" y="198" class="muted">Identity remains exact and selectable.</text><rect x="500" y="235" width="180" height="36" rx="5" fill="#e9ebee" stroke="#d7dbe0"/><text x="512" y="258" style="fill:#969ba3;font-size:13px">Open project</text><rect x="500" y="281" width="180" height="36" rx="5" fill="#e9ebee" stroke="#d7dbe0"/><text x="512" y="304" style="fill:#969ba3;font-size:13px">Download backup</text><rect x="936" y="110" width="430" height="300" rx="6" fill="#fff" stroke="#d7dbe0"/><text x="956" y="144" class="h">Retained result unknown</text><text x="956" y="177" class="error">Entered name is preserved.</text><text x="956" y="198" class="error">Do not repeat creation.</text><rect x="956" y="235" width="210" height="36" rx="5" fill="#fff" stroke="#d7dbe0"/><text x="968" y="258" style="fill:#25282d;font-size:13px">Check retained result</text><rect x="956" y="283" width="210" height="36" rx="5" fill="#fff" stroke="#d7dbe0"/><text x="968" y="306" style="fill:#25282d;font-size:13px">Review before leaving</text><rect x="1392" y="110" width="480" height="300" rx="6" fill="#fff" stroke="#d7dbe0"/><text x="1412" y="144" class="h">New project · validation</text><text x="1412" y="173" class="small">Project name</text><rect x="1412" y="187" width="360" height="38" rx="5" fill="#fff" stroke="#ba443b"/><text x="1422" y="211" class="mono"></text><text x="1412" y="254" class="error">A project name is required.</text><rect x="1412" y="288" width="144" height="36" rx="5" fill="#272b31" stroke="#d7dbe0"/><text x="1424" y="311" style="fill:#fff;font-size:13px">Create project</text><rect x="24" y="440" width="430" height="465" rx="6" fill="#fff" stroke="#d7dbe0"/><text x="44" y="474" class="h">Reference · authored value</text><rect x="44" y="499" width="178" height="36" rx="5" fill="#fff" stroke="#d7dbe0"/><text x="56" y="522" style="fill:#25282d;font-size:13px">Literal color</text><rect x="230" y="499" width="178" height="36" rx="5" fill="#272b31" stroke="#d7dbe0"/><text x="242" y="522" style="fill:#fff;font-size:13px">Reference</text><text x="44" y="570" class="small">Target token</text><rect x="44" y="585" width="350" height="38" rx="5" fill="#fff" stroke="#cdd2da"/><text x="54" y="609" class="mono">color.blue.600</text><text x="44" y="656" class="muted small">Uses the selected token’s whole color value.</text><text x="44" y="677" class="muted small">References stay linked; cycles are rejected</text><text x="44" y="698" class="muted small">on Apply.</text><text x="44" y="744" class="small">Draft preview: resolved color</text><rect x="44" y="781" width="85" height="36" rx="5" fill="#fff" stroke="#d7dbe0"/><text x="56" y="804" style="fill:#25282d;font-size:13px">Cancel</text><rect x="139" y="781" width="270" height="36" rx="5" fill="#272b31" stroke="#d7dbe0"/><text x="151" y="804" style="fill:#fff;font-size:13px">Apply changes</text><rect x="480" y="440" width="430" height="465" rx="6" fill="#fff" stroke="#d7dbe0"/><text x="500" y="474" class="h">Resolved &amp; trace</text><text x="500" y="510" class="bold">Applied resolution</text><rect x="500" y="537" width="56" height="56" rx="0" fill="#204fd4" stroke="#d7dbe0"/><text x="574" y="561" class="bold">sRGB color</text><text x="500" y="629" class="bold">Resolution trace</text><text x="500" y="669" class="mono">color.action.primary → color.blue.600</text><text x="500" y="690" class="mono">Literal color value resolved.</text><text x="500" y="770" class="muted small">Unresolved outcomes show their real reason:</text><text x="500" y="791" class="muted small">missing reference, cycle or unsupported value.</text><text x="500" y="812" class="muted small">No invented preview or automatic repair.</text><rect x="936" y="440" width="430" height="465" rx="6" fill="#fff" stroke="#d7dbe0"/><text x="956" y="474" class="h">Inspection only</text><text x="956" y="511" class="muted">Another tab has editing access.</text><text x="956" y="532" class="muted">Local drafts remain in this page.</text><rect x="956" y="571" width="142" height="36" rx="5" fill="#fff" stroke="#d7dbe0"/><text x="968" y="594" style="fill:#25282d;font-size:13px">Check access</text><text x="956" y="653" class="muted small">Unsupported token: retained data is readable;</text><text x="956" y="674" class="muted small">revision controls are blocked.</text><text x="956" y="695" class="muted small">Group: existing read-only group details,</text><text x="956" y="716" class="muted small">identity and exact source remain available.</text><text x="956" y="737" class="muted small">No selection: select a token or group.</text><rect x="1392" y="440" width="480" height="465" rx="6" fill="#fff" stroke="#d7dbe0"/><text x="1412" y="474" class="h">Project read unavailable</text><text x="1412" y="510" class="error">Last coherent data is stale.</text><text x="1412" y="531" class="error">Inputs are preserved; writes are blocked.</text><rect x="1412" y="570" width="210" height="36" rx="5" fill="#fff" stroke="#d7dbe0"/><text x="1424" y="593" style="fill:#25282d;font-size:13px">Retry reading project</text><text x="1412" y="651" class="muted small">Target unavailable: preserved input remains</text><text x="1412" y="672" class="muted small">selectable; cannot recreate or retarget.</text><text x="1412" y="693" class="muted small">Baseline changed: show Previous / Current /</text><text x="1412" y="714" class="muted small">Preserved input, Review before reapply.</text><rect x="1412" y="773" width="210" height="36" rx="5" fill="#fff" stroke="#d7dbe0"/><text x="1424" y="796" style="fill:#25282d;font-size:13px">Review preserved input</text><rect x="24" y="935" width="580" height="490" rx="6" fill="#fff" stroke="#d7dbe0"/><text x="44" y="969" class="h">Discard unapplied changes?</text><text x="44" y="1006" class="muted">Session drafts and unfinished form input will</text><text x="44" y="1027" class="muted">be discarded. Applied data is unchanged.</text><rect x="44" y="1087" width="160" height="36" rx="5" fill="#fff" stroke="#d7dbe0"/><text x="56" y="1110" style="fill:#25282d;font-size:13px">Keep editing</text><rect x="216" y="1087" width="160" height="36" rx="5" fill="#272b31" stroke="#d7dbe0"/><text x="228" y="1110" style="fill:#fff;font-size:13px">Discard draft</text><text x="44" y="1188" class="muted small">320px: modal fills width minus 16px margins;</text><text x="44" y="1209" class="muted small">body scrolls and actions stack if needed.</text><text x="44" y="1230" class="muted small">Keep editing has the safe initial focus.</text><text x="44" y="1251" class="muted small">Unknown outcome uses Review before leaving,</text><text x="44" y="1272" class="muted small">Stay here / Leave project and existing warning.</text><text x="44" y="1293" class="muted small">Escape/backdrop retain current safe meanings.</text><rect x="632" y="935" width="580" height="490" rx="6" fill="#fff" stroke="#d7dbe0"/><text x="652" y="969" class="h">New color token / New group / Rename group</text><text x="652" y="1006" class="small">Name</text><rect x="652" y="1020" width="410" height="38" rx="5" fill="#fff" stroke="#cdd2da"/><text x="662" y="1044" class="mono">accent</text><text x="652" y="1092" class="small">Parent group</text><rect x="652" y="1105" width="410" height="38" rx="5" fill="#fff" stroke="#cdd2da"/><text x="662" y="1129" class="mono">color</text><text x="652" y="1183" class="muted small">Current description, layer and derived path feedback</text><text x="652" y="1204" class="muted small">remain, where applicable to the existing form.</text><text x="652" y="1225" class="muted small">Changed baseline: preserve exact input and target,</text><text x="652" y="1246" class="muted small">block submission until explicit review.</text><rect x="652" y="1300" width="90" height="36" rx="5" fill="#fff" stroke="#d7dbe0"/><text x="664" y="1323" style="fill:#25282d;font-size:13px">Cancel</text><rect x="758" y="1300" width="170" height="36" rx="5" fill="#272b31" stroke="#d7dbe0"/><text x="770" y="1323" style="fill:#fff;font-size:13px">Create token</text><rect x="1240" y="935" width="632" height="490" rx="6" fill="#fff" stroke="#d7dbe0"/><text x="1260" y="969" class="h">Replace local project</text><text x="1260" y="1006" class="muted">Atlas · exact project identity · backup snapshot date</text><text x="1260" y="1027" class="muted">18 groups · 324 tokens · backup diagnostics</text><text x="1260" y="1048" class="muted">The complete backup replaces applied local state.</text><text x="1260" y="1069" class="muted">Local-only authored content will be removed.</text><rect x="1260" y="1120" width="270" height="36" rx="5" fill="#fff" stroke="#d7dbe0"/><text x="1272" y="1143" style="fill:#25282d;font-size:13px">Download current local backup</text><text x="1260" y="1180" class="small">[ ] I kept an independent backup of this exact local</text><text x="1260" y="1201" class="small">     revision and accept complete replacement.</text><rect x="1260" y="1246" width="90" height="36" rx="5" fill="#fff" stroke="#d7dbe0"/><text x="1272" y="1269" style="fill:#25282d;font-size:13px">Cancel</text><rect x="1362" y="1246" width="260" height="36" rx="5" fill="#e9ebee" stroke="#d7dbe0"/><text x="1374" y="1269" style="fill:#969ba3;font-size:13px">Replace complete project</text><text x="1260" y="1333" class="muted small">Disabled until current-revision protection + acknowledgement.</text><text x="1260" y="1354" class="muted small">Changed local revision invalidates earlier protection.</text><text x="24" y="1490" class="muted">STATE RULES · same content across sizes; representative panels above are not simultaneous UI</text><text x="24" y="1520" class="muted">Pending: current command status and Check retained result remain visible; duplicate mutation stays blocked.</text><text x="24" y="1550" class="muted">Retained but unreadable: Retry reading project; never repeat successful creation/restore. Stage lost: Review selected file again.</text><text x="24" y="1580" class="muted">Restore review keeps exact identity, actual backup date, coverage and diagnostics; no synthetic dates on project rows.</text><text x="24" y="1610" class="muted">Read-only, unavailable, baseline review and unknown warnings stay outside collapsed/hidden browsing regions when relevant.</text><text x="24" y="1640" class="muted">Persistent-storage request moves to Projects; its actual browser response is advisory, never a durability guarantee.</text><text x="24" y="1670" class="muted">Native backup-file input is retained. No new file API, routing, restore merge, takeover or replay policy is selected.</text><text x="24" y="1700" class="muted">Artwork samples illustrate hierarchy; values/trace wording must come from existing source projections, not this sheet.</text></svg>