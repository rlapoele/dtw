<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img"><title>Color ramp creation V3 · Placement, repeated previews and narrow review</title><defs><pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#fff"/><path d="M0 0h8v8H0zM8 8h8v8H8z" fill="#ddd"/></pattern></defs><rect width="1600" height="1600" fill="#f5f5f5"/>
<text x="40" y="48" font-family="Arial, sans-serif" font-size="28" fill="#171717" font-weight="700">Color ramp creation V3 · Placement, repeated previews and narrow review</text>
<text x="40" y="82" font-family="Arial, sans-serif" font-size="16" fill="#626262" font-weight="400">Position is a reviewed recipe choice. No individual swatch editor is available during creation.</text>
<rect x="40" y="120" width="740" height="645" rx="5" fill="white" stroke="#d4d4d4"/>
<text x="64" y="158" font-family="Arial, sans-serif" font-size="22" fill="#171717" font-weight="700">A manual position disappears</text>
<text x="738" y="157" font-family="Arial, sans-serif" font-size="24" fill="#171717" font-weight="400">×</text>
<text x="64" y="187" font-family="Arial, sans-serif" font-size="14" fill="#626262" font-weight="400">Count changed from 11 to 6; manual step was 300.</text>
<text x="64" y="236" font-family="Arial, sans-serif" font-size="18" fill="#171717" font-weight="600">Available steps: 50, 200, 400, 600, 800, 950</text>
<rect x="64" y="273" width="692" height="150" rx="5" fill="#fafafa" stroke="#d4d4d4"/>
<text x="82" y="305" font-family="Arial, sans-serif" font-size="19" fill="#171717" font-weight="600">Step 300 no longer exists.</text>
<text x="82" y="339" font-family="Arial, sans-serif" font-size="17" fill="#626262" font-weight="400">Proposed replacement: 200</text>
<rect x="82" y="365" width="180" height="38" rx="5" fill="white" stroke="#d4d4d4"/>
<text x="94" y="390" font-family="Arial, sans-serif" font-size="15" fill="#171717" font-weight="600">Use step 200</text>
<rect x="276" y="365" width="220" height="38" rx="5" fill="white" stroke="#d4d4d4"/>
<text x="288" y="390" font-family="Arial, sans-serif" font-size="15" fill="#171717" font-weight="600">Choose another step</text>
<text x="64" y="474" font-family="Arial, sans-serif" font-size="16" fill="#171717" font-weight="600">No replacement is applied silently.</text>
<text x="64" y="515" font-family="Arial, sans-serif" font-size="15" fill="#626262" font-weight="400">Manual 200 would remain 200 because that label still exists.</text>
<text x="64" y="548" font-family="Arial, sans-serif" font-size="15" fill="#626262" font-weight="400">Auto recalculates instead: for this blue, 11 → 6 steps</text>
<text x="64" y="575" font-family="Arial, sans-serif" font-size="15" fill="#626262" font-weight="400">changes the suggested position from 500 to 400.</text>
<rect x="64" y="694" width="92" height="38" rx="5" fill="white" stroke="#d4d4d4"/>
<text x="76" y="719" font-family="Arial, sans-serif" font-size="15" fill="#171717" font-weight="600">Back</text>
<rect x="500" y="694" width="256" height="38" rx="5" fill="#e5e5e5" stroke="#d4d4d4"/>
<text x="512" y="719" font-family="Arial, sans-serif" font-size="15" fill="#888" font-weight="600">Create group and tokens</text>
<rect x="820" y="120" width="740" height="645" rx="5" fill="white" stroke="#d4d4d4"/>
<text x="844" y="158" font-family="Arial, sans-serif" font-size="22" fill="#171717" font-weight="700">The seed becomes exact white</text>
<text x="1518" y="157" font-family="Arial, sans-serif" font-size="24" fill="#171717" font-weight="400">×</text>
<text x="844" y="187" font-family="Arial, sans-serif" font-size="14" fill="#626262" font-weight="400">A manual interior position at 500 was selected.</text>
<text x="844" y="236" font-family="Arial, sans-serif" font-size="18" fill="#171717" font-weight="600">Seed: #ffffff · Manual position: 500</text>
<rect x="844" y="273" width="692" height="150" rx="5" fill="#fafafa" stroke="#d4d4d4"/>
<text x="862" y="305" font-family="Arial, sans-serif" font-size="19" fill="#171717" font-weight="600">White must be at step 50.</text>
<text x="862" y="339" font-family="Arial, sans-serif" font-size="16" fill="#626262" font-weight="400">There are no lighter steps above exact white.</text>
<rect x="862" y="365" width="170" height="38" rx="5" fill="white" stroke="#d4d4d4"/>
<text x="874" y="390" font-family="Arial, sans-serif" font-size="15" fill="#171717" font-weight="600">Use step 50</text>
<rect x="1046" y="365" width="150" height="38" rx="5" fill="white" stroke="#d4d4d4"/>
<text x="1058" y="390" font-family="Arial, sans-serif" font-size="15" fill="#171717" font-weight="600">Edit seed</text>
<text x="844" y="474" font-family="Arial, sans-serif" font-size="16" fill="#171717" font-weight="600">The draft keeps the requested position visible</text>
<text x="844" y="501" font-family="Arial, sans-serif" font-size="16" fill="#171717" font-weight="600">until you explicitly resolve it.</text>
<text x="844" y="548" font-family="Arial, sans-serif" font-size="15" fill="#626262" font-weight="400">Exact black follows the same rule at step 950.</text>
<text x="844" y="575" font-family="Arial, sans-serif" font-size="15" fill="#626262" font-weight="400">Auto mode recalculates to the valid endpoint.</text>
<rect x="844" y="694" width="92" height="38" rx="5" fill="white" stroke="#d4d4d4"/>
<text x="856" y="719" font-family="Arial, sans-serif" font-size="15" fill="#171717" font-weight="600">Back</text>
<rect x="1280" y="694" width="256" height="38" rx="5" fill="#e5e5e5" stroke="#d4d4d4"/>
<text x="1292" y="719" font-family="Arial, sans-serif" font-size="15" fill="#888" font-weight="600">Create group and tokens</text>
<rect x="40" y="800" width="740" height="690" rx="5" fill="white" stroke="#d4d4d4"/>
<text x="64" y="838" font-family="Arial, sans-serif" font-size="22" fill="#171717" font-weight="700">Repeated preview values</text>
<text x="738" y="837" font-family="Arial, sans-serif" font-size="24" fill="#171717" font-weight="400">×</text>
<text x="64" y="867" font-family="Arial, sans-serif" font-size="14" fill="#626262" font-weight="400">Near-white #fafafa at manual step 500 · sRGB</text>
<rect x="64.0" y="902" width="58.36363636363637" height="44" rx="3" fill="#fcfcfc" stroke="#d4d4d4"/>
<text x="68.0" y="966" font-family="Arial, sans-serif" font-size="13" fill="#171717" font-weight="400">50</text>
