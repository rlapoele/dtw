<text x="512" y="1450" font-family="Arial, sans-serif" font-size="15" fill="white" font-weight="600">Create group and tokens</text>
<rect x="820" y="800" width="740" height="690" rx="5" fill="white" stroke="#d4d4d4"/>
<text x="844" y="837" font-family="Arial, sans-serif" font-size="22" fill="#171717" font-weight="700">Narrow final view</text>
<text x="844" y="865" font-family="Arial, sans-serif" font-size="15" fill="#626262" font-weight="400">One column; no extra review screen.</text>
<rect x="1010" y="890" width="360" height="548" rx="12" fill="white" stroke="#a3a3a3"/>
<text x="1028" y="921" font-family="Arial, sans-serif" font-size="19" fill="#171717" font-weight="700">Position and create</text>
<text x="1028" y="951" font-family="Arial, sans-serif" font-size="14" fill="#626262" font-weight="400">color.blue · 11 tokens</text>
<text x="1028" y="977" font-family="Arial, sans-serif" font-size="14" fill="#171717" font-weight="600">Target gamut: sRGB</text>
<text x="1028" y="1012" font-family="Arial, sans-serif" font-size="14" fill="#171717" font-weight="400">● Auto 500    ○ Choose step</text>
