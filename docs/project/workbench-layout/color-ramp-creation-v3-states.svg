<text x="511.54545454545456" y="966" font-family="Arial, sans-serif" font-size="13" fill="#171717" font-weight="400">700</text>
<rect x="570.909090909091" y="902" width="58.36363636363637" height="44" rx="3" fill="#585858" stroke="#d4d4d4"/>
<text x="574.909090909091" y="966" font-family="Arial, sans-serif" font-size="13" fill="#171717" font-weight="400">800</text>
<rect x="634.2727272727273" y="902" width="58.36363636363637" height="44" rx="3" fill="#2b2b2b" stroke="#d4d4d4"/>
<text x="638.2727272727273" y="966" font-family="Arial, sans-serif" font-size="13" fill="#171717" font-weight="400">900</text>
<rect x="697.6363636363636" y="902" width="58.36363636363637" height="44" rx="3" fill="#161616" stroke="#d4d4d4"/>
<text x="701.6363636363636" y="966" font-family="Arial, sans-serif" font-size="13" fill="#171717" font-weight="400">950</text>
<rect x="64" y="1010" width="692" height="130" rx="5" fill="#fafafa" stroke="#d4d4d4"/>
<text x="82" y="1041" font-family="Arial, sans-serif" font-size="19" fill="#171717" font-weight="600">Some sRGB HEX previews repeat.</text>
<text x="82" y="1071" font-family="Arial, sans-serif" font-size="16" fill="#626262" font-weight="400">50 / 100 / 200: #fcfcfc · 300 / 400: #fbfbfb</text>
<text x="82" y="1104" font-family="Arial, sans-serif" font-size="15" fill="#626262" font-weight="400">The authored OKLCH values remain different.</text>
<text x="64" y="1190" font-family="Arial, sans-serif" font-size="17" fill="#171717" font-weight="600">This feedback does not block creation.</text>
<text x="64" y="1230" font-family="Arial, sans-serif" font-size="15" fill="#626262" font-weight="400">Changing the background changes only the preview,</text>
<text x="64" y="1255" font-family="Arial, sans-serif" font-size="15" fill="#626262" font-weight="400">not alpha, authored values, or the target gamut.</text>
<text x="64" y="1301" font-family="Arial, sans-serif" font-size="14" fill="#626262" font-weight="400">Preview background</text>
<rect x="64" y="1320" width="160" height="38" rx="5" fill="#171717" stroke="#171717"/>
